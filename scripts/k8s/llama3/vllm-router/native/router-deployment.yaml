apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-router
  namespace: vllm-router-llama31
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-router-pod-discovery
  namespace: vllm-router-llama31
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-router-pod-discovery
  namespace: vllm-router-llama31
subjects:
- kind: ServiceAccount
  name: vllm-router
  namespace: vllm-router-llama31
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vllm-router-pod-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router-llama31
  namespace: vllm-router-llama31
  labels:
    app: vllm-router
    mode: native
    model: llama31
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
      mode: native
      model: llama31
  template:
    metadata:
      labels:
        app: vllm-router
        mode: native
        model: llama31
    spec:
      serviceAccountName: vllm-router
      containers:
      - name: router
        image: 584868043064.dkr.ecr.us-west-2.amazonaws.com/dev-vllm-repo:router-dp-fallback
        command:
          - vllm-router
          - --service-discovery
          - --service-discovery-namespace
          - vllm-router-llama31
          - --service-discovery-port
          - "8200"
          - --selector
          - llm-d.ai/role=decode
          - llm-d.ai/inferenceServing=true
          - --host
          - "0.0.0.0"
          - --port
          - "10001"
          - --intra-node-data-parallel-size
          - "1"
          - --log-level
          - info
        ports:
        - containerPort: 10001
          name: router
          protocol: TCP
        - containerPort: 29000
          name: metrics
          protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 10001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 10001
          initialDelaySeconds: 5
          periodSeconds: 10
